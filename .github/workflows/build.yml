name: Windows VSIX
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run package
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: codex-status-win-x64
          path: |
            dist/*.vsix
            dist/SHA256SUMS.txt
